name: Daily reading digest

on:
  schedule:
    # 23:00 UTC = 隔天早上 07:00 台北時間。想改時間就改這行（用 UTC）。
    - cron: "0 23 * * *"
  workflow_dispatch:      # 也允許在 Actions 頁面手動觸發（用來測試）
    inputs:
      deploy_only:
        description: "只重新部署 repo 裡現有的 public/（跳過抓取、摘要、commit）。部署步驟失敗時用，避免重跑 aggregate 把當期蓋成空頁。"
        type: boolean
        default: false

# 讓 workflow 能：把 seen.json/public 推回 repo、部署到 Pages
permissions:
  contents: write
  pages: write
  id-token: write

# 同一時間只跑一份，避免 push 衝突
concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        if: ${{ !inputs.deploy_only }}
        run: pip install -r requirements.txt

      - name: Build digest
        if: ${{ !inputs.deploy_only }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python aggregate.py

      - name: Commit state & output back to repo
        if: ${{ !inputs.deploy_only }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # inbox/ 被處理完清空後，git 不追蹤空目錄，該路徑會在 checkout 時消失，
          # 直接 git add 會 fatal: pathspec did not match。改成只 add 存在的路徑。
          for p in data public inbox processed; do
            [ -d "$p" ] && git add -A "$p"
          done
          if git diff --staged --quiet; then
            echo "沒有變更，跳過 commit。"
          else
            git commit -m "digest: $(date -u +%Y-%m-%d)"
            # 攝取端 bot 也會 push inbox 檔到 main，push 前先 rebase 避免非快轉衝突。
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # upload 剛 finalize 後立刻查 artifact 清單，GitHub 端偶爾還查不到
      # （"No artifacts named github-pages"，2026-11-24/25 連兩天）。
      # 第一次失敗就等一下再部署一次，而不是整個 job 掛掉。
      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait for artifact to become visible
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
